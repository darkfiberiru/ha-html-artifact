<!doctype html>
<!--
  Example 2 of the framework: nothing to do with cooking. A household board that mixes
  live entities, service calls and shared notes. Publish with capabilities:
    {"entities": ["sensor.*temperature*", "light.*"], "services": ["light.toggle"]}
  and approve them in the panel; until then the tiles say what is missing.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>House Board</title>
<style>
  :root { --bg:#f5f5f2; --card:#fff; --fg:#1d1d1b; --muted:#66665f; --line:#e1e1da; --accent:#2f5f9e; --on:#e8a400; }
  :root[data-theme="dark"] { --bg:#121314; --card:#1b1d1f; --fg:#ececea; --muted:#9d9d96; --line:#2c2f31; --accent:#8db6f0; --on:#ffc83d; }
  * { box-sizing: border-box; }
  body { margin:0; padding:16px; background:var(--bg); color:var(--fg); font:16px/1.45 system-ui,-apple-system,sans-serif; }
  .wrap { max-width: 900px; margin: 0 auto; display: grid; gap: 16px; }
  h1 { margin: 0 0 2px; font-size: 28px; }
  h2 { margin: 0 0 10px; font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 16px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
  .tile { border: 1px solid var(--line); border-radius: 12px; padding: 12px; background: transparent; color: inherit; text-align: left; font: inherit; }
  button.tile { cursor: pointer; min-height: 64px; }
  .tile .n { color: var(--muted); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tile .v { font-size: 26px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .tile.on { border-color: var(--on); box-shadow: inset 0 0 0 1px var(--on); }
  .tile.on .v { color: var(--on); }
  textarea { width: 100%; min-height: 140px; resize: vertical; font: inherit; color: inherit; background: transparent; border: 1px solid var(--line); border-radius: 12px; padding: 10px; }
  .muted { color: var(--muted); font-size: 14px; }
</style>
</head>
<body>
<div class="wrap">
  <header><h1>House Board</h1><div class="muted" id="who"></div></header>
  <section class="card"><h2>Temperatures</h2><div class="grid" id="temps"><span class="muted">Waiting for permission to read sensors...</span></div></section>
  <section class="card"><h2>Lights (tap to toggle)</h2><div class="grid" id="lights"><span class="muted">Waiting for permission to read lights...</span></div></section>
  <section class="card"><h2>Notes for everyone</h2>
    <textarea id="notes" placeholder="Anything the household should see..."></textarea>
    <div class="muted" id="saved"></div>
  </section>
</div>

<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const states = new Map();

function draw() {
  const temps = [...states.values()].filter((s) => s.entity_id.startsWith("sensor."));
  const lights = [...states.values()].filter((s) => s.entity_id.startsWith("light."));
  if (temps.length) $("temps").innerHTML = temps.map((s) =>
    `<div class="tile"><div class="n">${esc(s.attributes.friendly_name || s.entity_id)}</div><div class="v">${esc(s.state)}<span class="muted"> ${esc(s.attributes.unit_of_measurement || "")}</span></div></div>`).join("");
  if (lights.length) $("lights").innerHTML = lights.map((s) =>
    `<button class="tile ${s.state === "on" ? "on" : ""}" data-id="${esc(s.entity_id)}"><div class="n">${esc(s.attributes.friendly_name || s.entity_id)}</div><div class="v">${esc(s.state)}</div></button>`).join("");
}

(async () => {
  await ha.ready;
  $("who").textContent = "Signed in as " + ha.user.name;

  const onState = (s, id) => { if (s) states.set(id, s); else states.delete(id); draw(); };
  ha.entities.subscribe(["sensor.*temperature*", "light.*"], onState);

  $("lights").onclick = (e) => {
    const b = e.target.closest("button[data-id]");
    if (b) ha.callService("light", "toggle", {}, { entity_id: b.dataset.id }).catch((err) => alert(err.message));
  };

  // Notes: shared by every device, live.
  $("notes").value = (await ha.kv.get("notes")) || "";
  let t;
  $("notes").oninput = () => {
    clearTimeout(t);
    t = setTimeout(async () => { await ha.kv.set("notes", $("notes").value); $("saved").textContent = "Saved"; }, 600);
  };
  ha.kv.subscribe(({ key, value }) => {
    if (key === "notes" && document.activeElement !== $("notes")) $("notes").value = value || "";
  });
})();
</script>
</body>
</html>
